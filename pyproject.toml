[project]
name = "trustdesk"
version = "0.1.0"
description = "TrustDesk: AI Support Operations Agent - Enterprise Support Co-pilot with Grounded RAG, HITL Actions, and Adversarial Guardrails"
authors = [{ name = "Mohammed Hasheem" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
