      const container = document.getElementById("scene-container");
      container.innerHTML = scene.render();
      document.getElementById("live-caption").innerText = `"${scene.narration}"`;
      document.getElementById("scene-indicator").innerText = `Slide ${currentSceneIdx + 1} of ${scenes.length}: ${scene.title}`;

      // Update pills
      document.querySelectorAll(".scene-pill").forEach((pill, idx) => {
        if (idx === currentSceneIdx) {
          pill.className = "scene-pill px-2.5 py-1 rounded-md bg-blue-600 text-white font-bold";
        } else {
          pill.className = "scene-pill px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 hover:bg-slate-700";
        }
      });

      if (voiceEnabled && isPlaying) {
        speakNarration(scene.narration);
      }
    }

    function speakNarration(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById("btn-play");
      if (isPlaying) {
        btn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
        startTimer();
        speakNarration(scenes[currentSceneIdx].narration);
      } else {
        btn.innerHTML = `<i class="fa-solid fa-play ml-0.5"></i>`;
        clearInterval(timerInterval);
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (currentSeconds >= TOTAL_SECONDS) {
          clearInterval(timerInterval);
          isPlaying = false;
          document.getElementById("btn-play").innerHTML = `<i class="fa-solid fa-rotate-right"></i>`;
          return;
        }

        currentSeconds++;
        updateTimeUI();

        // Check if scene transition needed
        const currentScene = scenes[currentSceneIdx];
        if (currentSeconds >= currentScene.endSec && currentSceneIdx < scenes.length - 1) {
          currentSceneIdx++;
          renderCurrentScene();
        }
      }, 1000);
    }

    function updateTimeUI() {
      const mins = Math.floor(currentSeconds / 60);
      const secs = currentSeconds % 60;
      document.getElementById("time-current").innerText = 
        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      const pct = (currentSeconds / TOTAL_SECONDS) * 100;
      document.getElementById("video-progress").style.width = `${pct}%`;
    }

    function seekVideo(event) {
      const rect = event.currentTarget.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, clickX / rect.width));
      currentSeconds = Math.floor(ratio * TOTAL_SECONDS);
      updateTimeUI();

      // Find corresponding scene
      for (let i = 0; i < scenes.length; i++) {
        if (currentSeconds >= scenes[i].startSec && currentSeconds < scenes[i].endSec) {
          currentSceneIdx = i;
          renderCurrentScene();
          break;
        }
      }
    }

    function jumpToScene(idx) {
      currentSceneIdx = idx;
      currentSeconds = scenes[idx].startSec;
      updateTimeUI();
      renderCurrentScene();
    }

    function prevScene() {
      if (currentSceneIdx > 0) {
        jumpToScene(currentSceneIdx - 1);
      }
    }

    function nextScene() {
      if (currentSceneIdx < scenes.length - 1) {
        jumpToScene(currentSceneIdx + 1);
      }
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      const btn = document.getElementById("btn-voice");
      const label = document.getElementById("voice-label");
      if (voiceEnabled) {
        btn.className = "text-xs px-3 py-1.5 rounded-lg border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 font-medium flex items-center space-x-1.5 transition";
        label.innerText = "AI Voiceover: ON";
        if (isPlaying) speakNarration(scenes[currentSceneIdx].narration);
      } else {
        btn.className = "text-xs px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800 text-slate-400 font-medium flex items-center space-x-1.5 transition";
        label.innerText = "AI Voiceover: OFF";
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderCurrentScene();
      updateTimeUI();
    });
  </script>
</body>
</html>
